<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishGuard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080810;
  color: #c8c8e8;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.container { max-width: 620px; margin: 0 auto; }

/* HEADER */
.header { text-align: center; margin-bottom: 2.5rem; }
.logo-row { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 0.5rem; }
.shield-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #00ff88, #00cc66);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px rgba(0,255,136,0.3);
}
.logo-text { font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: -0.02em; }
.logo-text span { color: #00ff88; }
.tagline { color: #2a2a4a; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; background: #0e0e1c; border-radius: 12px; padding: 4px; }
.tab-btn {
  flex: 1; padding: 0.6rem;
  background: none; border: none; color: #3a3a5a;
  font-family: 'Courier New', monospace; font-size: 0.78rem;
  font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; border-radius: 9px; transition: all 0.2s;
}
.tab-btn:hover { color: #8888aa; }
.tab-btn.active { background: #1a1a2e; color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.1); }

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }

/* CARD */
.card {
  background: #0e0e1c;
  border: 1px solid #1a1a2e;
  border-radius: 14px;
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.card-label {
  font-size: 0.65rem; color: #00ff88;
  letter-spacing: 0.18em; text-transform: uppercase;
  margin-bottom: 0.75rem;
}

/* INPUTS */
.input-group { display: flex; gap: 8px; }
input[type="text"], textarea {
  width: 100%;
  padding: 0.8rem 1rem;
  background: #080810;
  border: 1px solid #1a1a2e;
  border-radius: 10px;
  color: #c8c8e8;
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
  resize: none;
}
input[type="text"]:focus, textarea:focus { border-color: #00ff88; }
input[type="text"]::placeholder, textarea::placeholder { color: #2a2a40; }

/* BUTTONS */
.btn {
  padding: 0.8rem 1.4rem;
  background: #00ff88;
  color: #000;
  border: none; border-radius: 10px;
  font-family: 'Courier New', monospace;
  font-weight: 900; font-size: 0.82rem;
  letter-spacing: 0.05em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.btn:hover { background: #00ffaa; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,255,136,0.25); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-ghost {
  background: transparent;
  color: #3a3a5a;
  border: 1px solid #1a1a2e;
}
.btn-ghost:hover { color: #ff4466; border-color: #ff4466; background: transparent; box-shadow: none; }

/* SPINNER */
.spinner { display: none; align-items: center; gap: 8px; margin-top: 1rem; color: #3a3a5a; font-size: 0.8rem; }
.spinner.show { display: flex; }
.dot { width: 5px; height: 5px; background: #00ff88; border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100%{opacity:0.15;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

/* RESULT */
.result-box {
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  display: flex; align-items: flex-start; gap: 1rem;
  margin-bottom: 1rem;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.result-box.phishing { background: rgba(255,40,80,0.07); border: 1px solid rgba(255,40,80,0.2); }
.result-box.safe { background: rgba(0,255,136,0.05); border: 1px solid rgba(0,255,136,0.2); }
.result-box.suspicious { background: rgba(255,180,0,0.07); border: 1px solid rgba(255,180,0,0.2); }
.result-icon {
  width: 46px; height: 46px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.phishing .result-icon { background: rgba(255,40,80,0.15); }
.safe .result-icon { background: rgba(0,255,136,0.1); }
.suspicious .result-icon { background: rgba(255,180,0,0.1); }
.result-title { font-size: 1rem; font-weight: 900; margin-bottom: 0.2rem; letter-spacing: 0.05em; }
.phishing .result-title { color: #ff2850; }
.safe .result-title { color: #00ff88; }
.suspicious .result-title { color: #ffb400; }
.result-url { font-size: 0.74rem; color: #2a2a40; word-break: break-all; margin-bottom: 0.4rem; }
.confidence { font-size: 0.76rem; color: #3a3a5a; margin-bottom: 0.6rem; }
.reasons { list-style: none; display: flex; flex-direction: column; gap: 3px; }
.reasons li { font-size: 0.78rem; color: #cc2244; padding-left: 1.1rem; position: relative; }
.reasons li::before { content: '▸'; position: absolute; left: 0; color: #ff2850; }
.reasons-safe li { color: #00aa55; }
.reasons-safe li::before { color: #00ff88; content: '✓'; }

/* VT BADGE */
.vt-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.7rem; padding: 3px 10px;
  border-radius: 6px; margin-top: 0.5rem;
}
.vt-badge.danger { background: rgba(255,40,80,0.12); color: #ff2850; border: 1px solid rgba(255,40,80,0.2); }
.vt-badge.ok { background: rgba(0,255,136,0.07); color: #00ff88; border: 1px solid rgba(0,255,136,0.15); }
.vt-badge.warn { background: rgba(255,180,0,0.07); color: #ffb400; border: 1px solid rgba(255,180,0,0.15); }

/* STATS */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.stat { background: #0e0e1c; border: 1px solid #1a1a2e; border-radius: 12px; padding: 1rem; text-align: center; }
.stat-num { font-size: 1.6rem; font-weight: 900; }
.stat-label { font-size: 0.65rem; color: #2a2a40; margin-top: 2px; letter-spacing: 0.12em; text-transform: uppercase; }
#num-checked { color: #00ff88; }
#num-phishing { color: #ff2850; }

/* SMS RESULTS */
.sms-url-item { margin-bottom: 0.75rem; }
.sms-verdict { text-align: center; padding: 1rem; border-radius: 12px; font-size: 0.9rem; font-weight: 900; letter-spacing: 0.05em; margin-bottom: 1rem; }
.sms-verdict.phishing { background: rgba(255,40,80,0.08); color: #ff2850; border: 1px solid rgba(255,40,80,0.2); }
.sms-verdict.safe { background: rgba(0,255,136,0.05); color: #00ff88; border: 1px solid rgba(0,255,136,0.15); }
.sms-verdict.suspicious { background: rgba(255,180,0,0.07); color: #ffb400; border: 1px solid rgba(255,180,0,0.2); }

/* HISTORY */
.history-item {
  display: flex; align-items: center; gap: 10px;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid #0e0e1c;
  transition: background 0.15s;
}
.history-item:hover { background: #0e0e1c; }
.history-item:last-child { border-bottom: none; }
.h-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.h-dot.phishing { background: #ff2850; box-shadow: 0 0 6px rgba(255,40,80,0.5); }
.h-dot.safe { background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.4); }
.h-url { flex: 1; font-size: 0.78rem; color: #5a5a7a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-label { font-size: 0.65rem; font-weight: 900; letter-spacing: 0.08em; }
.h-label.phishing { color: #ff2850; }
.h-label.safe { color: #00ff88; }
.h-time { font-size: 0.65rem; color: #2a2a40; }
.h-source { font-size: 0.6rem; color: #2a2a40; background: #1a1a2e; padding: 2px 6px; border-radius: 4px; }
.empty-history { text-align: center; padding: 2rem; color: #2a2a40; font-size: 0.8rem; }
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.history-header-title { font-size: 0.65rem; color: #00ff88; letter-spacing: 0.18em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo-row">
      <div class="shield-icon">🛡</div>
      <div class="logo-text">Phish<span>Guard</span></div>
    </div>
    <p class="tagline">AI Phishing Detector · v2.0</p>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="num-checked">0</div>
      <div class="stat-label">Tekshirildi</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="num-phishing">0</div>
      <div class="stat-label">Phishing</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('url', this)">🔗 URL</button>
    <button class="tab-btn" onclick="switchTab('sms', this)">💬 SMS</button>
    <button class="tab-btn" onclick="switchTab('history', this)">📋 Tarix</button>
  </div>

  <!-- URL PANEL -->
  <div class="panel active" id="panel-url">
    <div class="card">
      <div class="card-label">URL tekshirish</div>
      <div class="input-group">
        <input type="text" id="url-input" placeholder="https://example.com yoki http://fake-site.xyz" />
        <button class="btn" id="url-btn" onclick="analyzeURL()">Tekshir</button>
      </div>
      <div class="spinner" id="url-spinner">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span>AI tahlil qilmoqda...</span>
      </div>
    </div>
    <div id="url-result"></div>
  </div>

  <!-- SMS PANEL -->
  <div class="panel" id="panel-sms">
    <div class="card">
      <div class="card-label">SMS matnini tekshirish</div>
      <textarea id="sms-input" rows="4" placeholder="SMS matnini bu yerga yapıştiring...&#10;&#10;Masalan: Tabriklaymiz! Siz 1,000,000 so'm yutdingiz. Tasdiqlash uchun: http://fake-prize.xyz/claim"></textarea>
      <div style="margin-top: 10px;">
        <button class="btn" id="sms-btn" onclick="analyzeSMS()" style="width:100%;">SMS Tahlil Qilish</button>
      </div>
      <div class="spinner" id="sms-spinner">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span>SMS tahlil qilmoqda...</span>
      </div>
    </div>
    <div id="sms-result"></div>
  </div>

  <!-- HISTORY PANEL -->
  <div class="panel" id="panel-history">
    <div class="card" style="padding: 1rem;">
      <div class="history-header">
        <div class="history-header-title">Oxirgi tekshiruvlar</div>
        <button class="btn btn-ghost" onclick="clearHistory()" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">Tozalash</button>
      </div>
      <div id="history-list">
        <div class="empty-history">Hali hech narsa tekshirilmagan</div>
      </div>
    </div>
  </div>

</div>

<script>
let checked = 0, phishCount = 0;

function switchTab(name, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'history') loadHistory();
}

function updateStats() {
  document.getElementById('num-checked').textContent = checked;
  document.getElementById('num-phishing').textContent = phishCount;
}

function renderResult(data, containerId) {
  const isPhishing = data.result === 'phishing';
  const isSafe = data.result === 'safe';

  let vtHtml = '';
  if (data.virustotal && data.virustotal.checked) {
    const vt = data.virustotal;
    const vtClass = vt.malicious > 0 ? 'danger' : (vt.suspicious > 0 ? 'warn' : 'ok');
    const vtText = vt.malicious > 0
      ? `VirusTotal: ${vt.malicious}/${vt.total} xavfli`
      : `VirusTotal: ${vt.total} ta tekshiruv — xavfsiz`;
    vtHtml = `<div class="vt-badge ${vtClass}">🔬 ${vtText}</div>`;
  }

  const reasonsHtml = data.reasons && data.reasons.length > 0
    ? `<ul class="reasons">${data.reasons.map(r => `<li>${r}</li>`).join('')}</ul>`
    : (isSafe ? '<ul class="reasons reasons-safe"><li>Shubhali belgilar aniqlanmadi</li></ul>' : '');

  const boxClass = isPhishing ? 'phishing' : 'safe';
  const icon = isPhishing ? '⚠' : '✓';
  const title = isPhishing ? 'PHISHING ANIQLANDI' : 'XAVFSIZ';

  document.getElementById(containerId).innerHTML = `
    <div class="result-box ${boxClass}">
      <div class="result-icon">${icon}</div>
      <div style="flex:1;">
        <div class="result-title">${title}</div>
        <div class="result-url">${data.url}</div>
        <div class="confidence">AI ishonch darajasi: ${data.confidence}%</div>
        ${reasonsHtml}
        ${vtHtml}
      </div>
    </div>
  `;
}

async function analyzeURL() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  document.getElementById('url-btn').disabled = true;
  document.getElementById('url-result').innerHTML = '';
  document.getElementById('url-spinner').classList.add('show');

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    document.getElementById('url-spinner').classList.remove('show');

    renderResult(data, 'url-result');

    checked++;
    if (data.result === 'phishing') phishCount++;
    updateStats();
  } catch(e) {
    document.getElementById('url-spinner').classList.remove('show');
    document.getElementById('url-result').innerHTML = '<div style="color:#ff4466;font-size:0.8rem;padding:0.5rem;">⚠ Server bilan ulanishda xatolik. py app.py ishlatyaptimi?</div>';
  }

  document.getElementById('url-btn').disabled = false;
}

async function analyzeSMS() {
  const text = document.getElementById('sms-input').value.trim();
  if (!text) return;

  document.getElementById('sms-btn').disabled = true;
  document.getElementById('sms-result').innerHTML = '';
  document.getElementById('sms-spinner').classList.add('show');

  try {
    const res = await fetch('/analyze_sms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    document.getElementById('sms-spinner').classList.remove('show');

    let html = '';

    // Umumiy verdict
    const verdictIcons = { phishing: '🚨', safe: '✅', suspicious: '⚠️' };
    const verdictTexts = {
      phishing: 'XAVFLI SMS — PHISHING HAVOLASI ANIQLANDI',
      safe: 'SMS XAVFSIZ',
      suspicious: 'SHUBHALI SMS'
    };
    html += `<div class="sms-verdict ${data.sms_verdict}">
      ${verdictIcons[data.sms_verdict] || '❓'} ${verdictTexts[data.sms_verdict] || data.sms_verdict.toUpperCase()}
    </div>`;

    if (data.sms_reasons && data.sms_reasons.length > 0) {
      html += `<div class="card" style="margin-bottom:0.75rem;">
        <div class="card-label">Shubhali belgilar</div>
        <ul class="reasons">${data.sms_reasons.map(r => `<li>${r}</li>`).join('')}</ul>
      </div>`;
    }

    if (data.urls_found && data.urls_found.length > 0) {
      html += `<div class="card-label" style="margin-bottom:0.5rem;">SMS dagi URL lar (${data.urls_found.length} ta)</div>`;
      data.urls_found.forEach(u => {
        const boxClass = u.result === 'phishing' ? 'phishing' : 'safe';
        const icon = u.result === 'phishing' ? '⚠' : '✓';
        const title = u.result === 'phishing' ? 'PHISHING' : 'XAVFSIZ';
        const reasonsHtml = u.reasons && u.reasons.length > 0
          ? `<ul class="reasons">${u.reasons.map(r => `<li>${r}</li>`).join('')}</ul>` : '';
        html += `<div class="result-box ${boxClass}" style="margin-bottom:0.6rem;">
          <div class="result-icon">${icon}</div>
          <div style="flex:1;">
            <div class="result-title">${title}</div>
            <div class="result-url">${u.url}</div>
            <div class="confidence">${u.confidence}% ishonch</div>
            ${reasonsHtml}
          </div>
        </div>`;

        checked++;
        if (u.result === 'phishing') phishCount++;
      });
      updateStats();
    } else {
      html += `<div style="color:#3a3a5a;font-size:0.78rem;text-align:center;padding:0.5rem;">${data.message}</div>`;
    }

    document.getElementById('sms-result').innerHTML = html;
  } catch(e) {
    document.getElementById('sms-spinner').classList.remove('show');
    document.getElementById('sms-result').innerHTML = '<div style="color:#ff4466;font-size:0.8rem;padding:0.5rem;">⚠ Server bilan ulanishda xatolik.</div>';
  }

  document.getElementById('sms-btn').disabled = false;
}

async function loadHistory() {
  try {
    const res = await fetch('/history');
    const items = await res.json();
    const container = document.getElementById('history-list');

    if (!items.length) {
      container.innerHTML = '<div class="empty-history">Hali hech narsa tekshirilmagan</div>';
      return;
    }

    container.innerHTML = items.map(item => `
      <div class="history-item">
        <div class="h-dot ${item.result}"></div>
        <div class="h-url">${item.url}</div>
        ${item.source ? `<div class="h-source">${item.source}</div>` : ''}
        <div class="h-label ${item.result}">${item.result === 'phishing' ? 'XAVFLI' : 'XAVFSIZ'}</div>
        <div class="h-time">${item.time}</div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('history-list').innerHTML = '<div class="empty-history">Tarix yuklanmadi</div>';
  }
}

async function clearHistory() {
  await fetch('/clear_history', { method: 'POST' });
  document.getElementById('history-list').innerHTML = '<div class="empty-history">Hali hech narsa tekshirilmagan</div>';
}

// Enter tugmasi
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('panel-url').classList.contains('active')) {
    analyzeURL();
  }
});
</script>
</body>
</html>
